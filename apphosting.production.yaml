# Firebase App Hosting — backend de PRODUÇÃO (ultimate-drift-production) do site público.
# Carregado automaticamente quando o backend está marcado com environment=production.
# minInstances=1 garante warm start — crítico pra TTFB do Googlebot e Core Web Vitals.

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 20
  minInstances: 1
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDeDvwuw4RZfQkkJd_VXC1J20EcsPr_38g
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ultimate-drift-production.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ultimate-drift-production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ultimate-drift-production.appspot.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "9537542329"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:9537542329:web:c27bf9ad7bf961b6026368
    availability:
      - BUILD
      - RUNTIME

  # App Check — site key pública do reCAPTCHA Enterprise do PRD (ultimate-drift-production).
  # Registrada em Firebase Console → App Check → Apps → app web `ud-site` →
  # reCAPTCHA Enterprise. Pública por design (roda no client), então vai direto no yaml;
  # a secret key correspondente fica só no Console. Enquanto estiver
  # REPLACE_ME_*, o App Check não inicializa (ver src/lib/firebase/app-check.ts).
  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_RECAPTCHA_SITE_KEY
    value: 6LfCIM0tAAAAAA6EDN52fQNjLfEDqThJ7yspv2V2
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.ultimatedrift.com.br
    availability:
      - BUILD
      - RUNTIME

  # Analytics de terceiros — só em produção (HML/preview não têm estes vars, então
  # o componente <Analytics/> não dispara). NEXT_PUBLIC → inlined em build-time.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-FNNWZN504Y
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_CLARITY_ID
    value: y4kdzjhkcy
    availability:
      - BUILD
      - RUNTIME

